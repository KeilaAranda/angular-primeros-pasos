<h4>Listado</h4>
<ul class="list-group">
  <li class="list-group-item"> Krillin - 500 </li>
  <li *ngFor= "let character of characterList;
  let i = index;
  let isFirst = first;
  let isLast = last;
  let isEven = even;
  let isOdd = odd;
  "
  class="list-group-item d-flex juntify-content-between align-items-center"
  [ngClass]="{'list-group-item list-group-item-success': isFirst}">

<div>
 <span class="text-primary"> {{i +1}}</span>
 <span> {{character.name}} - </span>
 <strong>Power: </strong>
 <span>{{character.power}}</span>
</div>


  <button (click)="onDeleteCharacter(i)" class="btn btn-danger">X</button>
  </li>
</ul>
